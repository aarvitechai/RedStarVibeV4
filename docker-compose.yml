# Same compose file for local, staging and the Stage 1 VM; only .env differs (Blueprint 19.2).
# Open http://localhost:8080 — all traffic goes through the nginx gateway, as in production.

x-backend: &backend
  build: ./apps/backend
  image: ghcr.io/aarvitechai/redstarvibe-backend:${RSV_IMAGE_TAG:-local}
  env_file: .env
  restart: unless-stopped
  networks: [private]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${RSV_HTTP_PORT:-8080}:8080"
    networks: [public, private]
    depends_on: [api, web, ws]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ghcr.io/aarvitechai/redstarvibe-web:${RSV_IMAGE_TAG:-local}
    environment:
      NEXT_PUBLIC_MEDIA_ORIGIN: ${RSV_MEDIA_ORIGIN:-}
      RSV_INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_LIVEKIT_ORIGIN: ${RSV_LIVEKIT_URL:-}
      RSV_PUBLIC_BASE_URL: ${RSV_PUBLIC_BASE_URL:-http://localhost:8080}
    networks: [private]
    restart: unless-stopped
    mem_limit: 512m

  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.ensure_buckets && python -m scripts.index_help"]
    restart: "no"

  api:
    <<: *backend
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
    command: ["sh", "-c", "rm -rf /tmp/prom && mkdir -p /tmp/prom && exec gunicorn app.main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 -w ${RSV_API_WORKERS:-2} --graceful-timeout 30"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 768m

  ws:
    # WebSocket process (same image). Scale by open connections; Redis pub/sub links replicas.
    <<: *backend
    command: ["uvicorn", "app.realtime.app:app", "--host", "0.0.0.0", "--port", "8001", "--ws-ping-interval", "0", "--timeout-graceful-shutdown", "20"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 512m

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "${RSV_WORKER_QUEUES:-default,media,ai}", "--concurrency", "3", "--loglevel", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 768m

  beat:
    <<: *backend
    # Exactly one beat process (ADR 0001 / Blueprint 6.2).
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 256m

  db:
    build: ./infra/docker/postgres
    image: redstarvibe-postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rsv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run python scripts/bootstrap_env.py first}
      POSTGRES_DB: ${POSTGRES_DB:-rsv}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  livekit:
    # Local WebRTC SFU for calls (dev keys only). Staging/production use LiveKit Cloud or a self-hosted cluster.
    image: livekit/livekit-server:v1.9
    command: ["--dev", "--bind", "0.0.0.0"]
    environment:
      # Signalling/RTC ports must match the published ports (ICE candidates advertise them). Override if taken.
      LIVEKIT_CONFIG: |
        port: ${RSV_LIVEKIT_PORT:-7880}
        rtc:
          tcp_port: ${RSV_LIVEKIT_TCP_PORT:-7881}
          udp_port: ${RSV_LIVEKIT_UDP_PORT:-7882}
          use_external_ip: false
    ports:
      - "127.0.0.1:${RSV_LIVEKIT_PORT:-7880}:${RSV_LIVEKIT_PORT:-7880}"
      - "127.0.0.1:${RSV_LIVEKIT_TCP_PORT:-7881}:${RSV_LIVEKIT_TCP_PORT:-7881}"
      - "127.0.0.1:${RSV_LIVEKIT_UDP_PORT:-7882}:${RSV_LIVEKIT_UDP_PORT:-7882}/udp"
    networks: [private]
    restart: unless-stopped

  objectstore:
    # SeaweedFS S3 emulates Cloudflare R2 locally (ADR 0005). Never used in staging/production.
    image: chrislusf/seaweedfs:4.54
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=256", "-volume.max=100"]
    volumes:
      - objectdata:/data
    networks: [private]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    networks: [private]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---- Optional: monitoring (docker compose --profile monitoring up -d) ----
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.7.3
    volumes:
      - ./infra/monitoring/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${RSV_PROMETHEUS_PORT:-9090}:9090"
    networks: [private]
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.2.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${RSV_GRAFANA_PASSWORD:-change-me-locally}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${RSV_GRAFANA_PORT:-3001}:3000"
    networks: [private]
    restart: unless-stopped

  # ---- Optional: Level 2 scale-out pieces (docker compose --profile scale up -d) ----
  pgbouncer:
    # Transaction pooling (ADR 0002). Point RSV_DATABASE_URL at pgbouncer:6432 and set RSV_DB_PGBOUNCER=true.
    profiles: [scale]
    image: edoburu/pgbouncer:v1.24.1-p1
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rsv}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rsv}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "40"
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: "6432"
    networks: [private]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  worker-media:
    # Separate pool for media/AI (Blueprint 19.3 trigger: media queue > 500 for 30 min daily).
    # With this running, start the main worker with RSV_WORKER_QUEUES=default.
    profiles: [scale]
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "media,ai", "--concurrency", "${RSV_MEDIA_CONCURRENCY:-2}", "--loglevel", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 1g

networks:
  public: {}
  private:
    internal: false   # set true on servers once outbound access is proxied; db/redis never publish ports

volumes:
  pgdata: {}
  redisdata: {}
  objectdata: {}
  promdata: {}
