name: CI

on:
  pull_request:
  push:
    branches: [dev, staging, production, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["127.0.0.1:56379:6379"]
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - name: Start test Postgres (16 + PostGIS + pgvector)
        working-directory: .
        run: |
          docker build -q -t redstarvibe-postgres:16 infra/docker/postgres
          docker run -d --name testdb -e POSTGRES_USER=rsv -e POSTGRES_PASSWORD=rsvtest -e POSTGRES_DB=rsv_test             -p 127.0.0.1:55432:5432 redstarvibe-postgres:16
          for i in $(seq 1 30); do docker exec testdb pg_isready -U rsv -d rsv_test && break; sleep 1; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml
      - run: python -m pip install --upgrade pip setuptools && pip install -e ".[dev]" pip-audit
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app
      - name: Tests (unit + integration on real Postgres and Redis)
        run: pytest -q
      - name: OpenAPI contract is current
        run: |
          python -m scripts.export_openapi > /tmp/openapi.json
          diff -u ../../packages/api-types/openapi.json /tmp/openapi.json || (echo "::error::openapi.json is stale — run 'make types'" && exit 1)
      - name: Dependency audit
        run: pip-audit --skip-editable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm audit --omit=dev --audit-level=high

  api-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/api-types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Generated types are current
        run: npm run generate && git diff --exit-code -- index.ts

  images:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-only/' .env
          docker compose build
      - name: Scan backend image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:0.67.2 image             --db-repository public.ecr.aws/aquasecurity/trivy-db:2 --java-db-repository public.ecr.aws/aquasecurity/trivy-java-db:1             --severity CRITICAL,HIGH --ignore-unfixed --format json --output /out/trivy-backend.json             ghcr.io/aarvitechai/redstarvibe-backend:local
      - name: Report findings as annotations (fails on any fixable HIGH/CRITICAL)
        run: |
          python3 - <<'PY'
          import json, sys
          found = 0
          for r in json.load(open("trivy-backend.json")).get("Results", []):
              for v in r.get("Vulnerabilities") or []:
                  found += 1
                  print(f"::error title=Trivy {v['Severity']}::{r['Target']}: {v['PkgName']} {v['InstalledVersion']} -> {v.get('FixedVersion')} ({v['VulnerabilityID']})")
          print(f"{found} fixable HIGH/CRITICAL finding(s)")
          sys.exit(1 if found else 0)
          PY

  e2e:
    # Full stack in Docker, then Playwright journeys at 360 / 768 / 1280 px.
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          python3 scripts/bootstrap_env.py
          echo "RSV_RATE_LIMIT_SIGNUP_PER_HOUR=1000" >> .env
          docker compose up -d --build
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8080/health/ready && break; sleep 2; done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://127.0.0.1:8080 npx playwright test
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=200 api worker web gateway
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results
