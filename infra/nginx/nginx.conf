# Gateway: the only public application entry (behind Cloudflare Tunnel in staging/production).
# New top-level paths are added here. /ws and /mcp are added when those processes exist (Phase 4 / MCP).
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 2m;          # media never passes through here (presigned uploads go to R2)
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Docker's embedded DNS, so upstreams are resolved at request time and restarts don't break the gateway.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Replicas (docker compose --scale api=N) share one DNS name. `resolve` (nginx >= 1.27.3) keeps the address
  # list current, and the shared zone remembers a failed replica for every request and worker: one failed
  # connect takes it out of rotation for 10 s. A request that was never sent is retried on the next replica,
  # which is safe even for POST. Phase 8 failover test: docs/capacity/2026-11-17-baseline.md.
  upstream api_upstream { zone api_upstream 64k; server api:8000 resolve max_fails=1 fail_timeout=10s; }
  upstream ws_upstream  { zone ws_upstream 64k;  server ws:8001  resolve max_fails=1 fail_timeout=10s; }
  upstream web_upstream { zone web_upstream 64k; server web:3000 resolve max_fails=1 fail_timeout=10s; }
  proxy_next_upstream error timeout;
  proxy_next_upstream_tries 2;

  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  log_format main '$remote_addr "$request" $status $body_bytes_sent $request_time rid=$req_id';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  server {
    listen 8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # HSTS is set at the Cloudflare edge for staging/production.

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;  # same Docker network: a healthy replica connects in < 1 ms
    proxy_read_timeout 60s;

    # Internal metrics are scraped on the private network only.
    location = /metrics { return 404; }

    location /ws {
      proxy_pass http://ws_upstream;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 120s;   # > 25 s heartbeat
    }

    location = /mcp {
      proxy_pass http://api_upstream;
    }

    location /api/ {
      proxy_pass http://api_upstream;
    }

    # Local object storage (SeaweedFS). In staging/production these paths are served by R2 + CDN instead.
    # Browser presigned PUTs go to /rsv-raw/; validated renditions are read from /rsv-public/.
    location /rsv-raw/ {
      client_max_body_size 210m;
      proxy_request_buffering off;
      set $s3 http://objectstore:8333;
      proxy_pass $s3;
    }

    location /rsv-public/ {
      limit_except GET HEAD { deny all; }
      set $s3 http://objectstore:8333;
      proxy_pass $s3;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /health/ {
      proxy_pass http://api_upstream;
    }

    location / {
      proxy_pass http://web_upstream;
    }
  }
}
