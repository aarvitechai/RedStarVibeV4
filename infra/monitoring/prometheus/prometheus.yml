global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

# DNS discovery: every replica (docker compose --scale api=N) is scraped as its own target.
scrape_configs:
  - job_name: api
    dns_sd_configs: [{ names: ["api"], type: A, port: 8000, refresh_interval: 15s }]
  - job_name: ws
    dns_sd_configs: [{ names: ["ws"], type: A, port: 8001, refresh_interval: 15s }]
