[project]
name = "redstarvibe-backend"
version = "0.1.0"
description = "RedStarVibe modular monolith backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163,<0.164",
    "uvicorn[standard]>=0.54,<0.55",
    "gunicorn>=27.0,<28",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32,<0.33",
    "alembic>=1.20,<2",
    "redis>=8.1,<9",
    "celery[redis]>=5.7,<6",
    "structlog>=26.1",
    "argon2-cffi>=25.1",
    "pyjwt>=2.15,<3",
    "email-validator>=2.4",
    "httpx>=0.28",
    "cryptography>=46",
    "tzdata>=2025.2",
    "boto3>=1.40",
    "pillow>=12",
    "segno>=1.6",
    "prometheus-client>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "httpx>=0.28",
    "ruff>=0.17",
    "mypy>=2.4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "E501", "UP040", "UP046", "UP047"]  # asserts ok; ruff format owns line length; keep 3.11-compatible generics syntax

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "E501"]
# Fixed ffmpeg/ffprobe argument lists on files we created; never user-controlled strings.
"app/modules/media/processing.py" = ["S603", "S607"]
"app/modules/albums/service.py" = ["S603", "S607"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "boto3.*", "botocore.*", "segno.*", "prometheus_client.*"]
ignore_missing_imports = true
follow_untyped_imports = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["app.workers.*", "app.modules.*.tasks"]
disallow_untyped_decorators = false
